<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estúdio dos textos — restaurante</title>
<style>
  :root {
    --bg: #10151b;
    --surface: #171e26;
    --surface2: #1e2732;
    --line: #2a3542;
    --text: #e8edf2;
    --muted: #93a1b0;
    --brand: #d4a24c;
    --ok: #4ec38a;
    --warn: #e2b341;
    --err: #e2685f;
    --zap: #075e54;
    --bolha: #202c33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; cursor: pointer; }
  textarea, input, select { font: inherit; color: inherit; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--brand); }
  select, .campo, textarea {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 10px; color: var(--text);
  }
  #busca { width: 240px; }
  .cresce { flex: 1; }

  .modos { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .modo {
    background: transparent; border: none; border-radius: 6px; padding: 7px 14px;
    color: var(--muted); font-weight: 500;
  }
  .modo.ativa { background: var(--surface2); color: var(--text); }
  .modo.ativa::after {
    content: ''; display: block; height: 2px; background: var(--brand);
    margin: 6px -14px -7px; border-radius: 2px;
  }
  .abas { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
  .aba {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; color: var(--muted);
  }
  .aba.ativa { background: var(--brand); border-color: var(--brand); color: #1a1206; font-weight: 600; }
  .aba .conta { opacity: .7; margin-left: 6px; font-size: 12px; }

  main { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 16px 20px 96px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } #preview { position: static; } }

  .cartao {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .cartao.editando { border-color: var(--brand); }
  .cartao h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .cartao .chave { font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cartao .ajuda { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
  .linha1 { display: flex; align-items: flex-start; gap: 10px; }
  .selo {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    background: rgba(212,162,76,.15); color: var(--brand); border: 1px solid rgba(212,162,76,.35);
  }
  textarea, input.campo { width: 100%; margin-top: 10px; resize: vertical; }
  textarea { min-height: 42px; line-height: 1.55; }
  textarea:focus, input.campo:focus { outline: 2px solid var(--brand); outline-offset: -1px; }

  .rodapeCartao { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .var {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 7px; font-size: 11.5px; color: var(--brand);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .var:hover { border-color: var(--brand); }
  .contador { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .contador.estourou { color: var(--err); font-weight: 600; }
  .link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }
  .link:hover { color: var(--text); }

  #preview { position: sticky; top: 78px; }
  #preview h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }
  .zap { background: #0b141a; border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 120px; }
  .bolha {
    background: var(--bolha); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap;
    word-break: break-word; font-size: 13.5px; max-width: 320px;
  }
  .btnZap {
    display: block; width: 100%; margin-top: 4px; padding: 9px; text-align: center;
    background: var(--bolha); border-top: 1px solid #2f3d45; color: #53bdeb; font-size: 13.5px;
    border-radius: 0 0 8px 8px;
  }
  .secaoZap { color: var(--muted); font-size: 11px; text-transform: uppercase; margin: 12px 0 4px; letter-spacing: .6px; }
  .rowZap { border-top: 1px solid #2f3d45; padding: 8px 2px; font-size: 13.5px; }
  .rowZap small { display: block; color: var(--muted); font-size: 12px; }
  .cortado { color: var(--err); }

  .avisoTemplate {
    background: rgba(226,104,95,.1); border: 1px solid rgba(226,104,95,.4);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .avisoTemplate strong { color: var(--err); }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--line); z-index: 10;
  }
  .btn {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 18px; color: var(--text); font-weight: 500;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primario { background: var(--brand); border-color: var(--brand); color: #1a1206; font-weight: 600; }
  #situacao { color: var(--muted); font-size: 13px; }
  #situacao.ok { color: var(--ok); }
  #situacao.erro { color: var(--err); }

  dialog {
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; width: min(760px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  pre.diff {
    background: #0b141a; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    max-height: 340px; overflow: auto; font-size: 12px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .diff .mais { color: var(--ok); }
  .diff .menos { color: var(--err); }
  .diff .cab { color: var(--muted); }
  .acoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .vazio { color: var(--muted); padding: 30px; text-align: center; }

  /* --- conteúdo (cardápio, ambientes, equipe, horários, regras) --- */
  .grade { display: grid; gap: 10px; }
  .grade.duas { grid-template-columns: 1fr 1fr; }
  .grade.tres { grid-template-columns: 2fr 1fr 1fr; }
  @media (max-width: 720px) { .grade.duas, .grade.tres { grid-template-columns: 1fr; } }
  .campoRot { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .campoRot small { color: var(--brand); opacity: .8; }
  .item { position: relative; }
  .item .remover {
    position: absolute; top: 12px; right: 12px; background: transparent;
    border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font-size: 12px;
  }
  .item .remover:hover { border-color: var(--err); color: var(--err); }
  .slugTag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: var(--muted); background: var(--surface2); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 6px;
  }
  .novoItem { width: 100%; padding: 12px; border-style: dashed; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .switch input { width: 16px; height: 16px; accent-color: var(--brand); }
  .faixa { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .faixa input { width: 82px; text-align: center; }
  .faixa button { background: none; border: none; color: var(--muted); font-size: 16px; padding: 0 4px; }
  .faixa button:hover { color: var(--err); }
  .dia { display: grid; grid-template-columns: 90px 1fr auto; align-items: start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .dia:last-child { border-bottom: none; }
  .dia .nome { padding-top: 8px; font-weight: 500; }
  .fechado { color: var(--muted); padding-top: 8px; font-size: 13px; }
  .avisoUso {
    background: rgba(226,179,65,.1); border: 1px solid rgba(226,179,65,.4);
    border-radius: 6px; padding: 8px 10px; font-size: 12.5px; margin-top: 10px; color: var(--warn);
  }
  .secTitulo { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 18px 0 8px; }
</style>
</head>
<body>

<header>
  <h1>Estúdio dos textos <span>💈</span></h1>
  <select id="tenant" title="Restaurante"></select>
  <input id="busca" class="campo" type="search" placeholder="Buscar texto…" />
  <div class="cresce"></div>
  <span id="branch" style="color:var(--muted);font-size:12.5px"></span>
</header>

<nav class="modos" id="modos"></nav>
<nav class="abas" id="abas"></nav>

<main>
  <div id="lista"><p class="vazio">Carregando…</p></div>
  <aside id="preview">
    <h2>Como fica no WhatsApp</h2>
    <div class="zap" id="zap"><p style="color:var(--muted);margin:0">Clique num texto para ver a prévia.</p></div>
  </aside>
</main>

<footer>
  <button class="btn primario" id="salvar" disabled>Salvar</button>
  <button class="btn" id="publicar">Publicar…</button>
  <button class="btn" id="reverter" disabled>Descartar edições</button>
  <span id="situacao"></span>
</footer>

<dialog id="modalPublicar">
  <h2>Publicar na branch <code id="modalBranch"></code></h2>
  <p style="color:var(--muted);font-size:13px;margin-top:0">
    Isto faz <code>add</code>, <code>commit</code> e <code>push</code> dos
    <code>restaurante.config.json</code> dos restaurantes. Mais nada entra no commit.
  </p>
  <pre class="diff" id="modalDiff"></pre>
  <input id="modalMensagem" class="campo" style="width:100%;margin-top:12px"
         placeholder="Mensagem do commit — ex.: Ajusta o tom das mensagens do cliente" />
  <div class="acoes">
    <button class="btn" id="modalCancelar">Cancelar</button>
    <button class="btn primario" id="modalConfirmar">Commit e push</button>
  </div>
</dialog>

<script>
const $ = (sel) => document.querySelector(sel)

const MODOS = [
  { id: 'textos', nome: 'Textos' },
  { id: 'menu', nome: 'Cardápio' },
  { id: 'areas', nome: 'Ambientes' },
  { id: 'team', nome: 'Equipe' },
  { id: 'hours', nome: 'Horários' },
  { id: 'contact', nome: 'Marca e contato' },
  { id: 'booking', nome: 'Regras das reservas' },
  { id: 'whatsapp', nome: 'Atendimento' },
]

const estado = {
  slug: null,
  grupos: {},
  modo: 'textos',
  // textos
  textos: [],          // catálogo + valor salvo
  edicoes: {},         // key -> valor na tela (só o que difere do salvo)
  aba: 'cliente',
  busca: '',
  focada: null,
  // conteúdo
  conteudo: null,      // o que está no disco
  rascunho: null,      // o que está na tela
  dias: [],
  uso: { areas: {}, semBanco: true },
}

const emTextos = () => estado.modo === 'textos'
const clonar = (valor) => JSON.parse(JSON.stringify(valor))

const api = async (metodo, url, corpo) => {
  const resposta = await fetch(url, {
    method: metodo,
    headers: corpo ? { 'content-type': 'application/json' } : {},
    body: corpo ? JSON.stringify(corpo) : undefined,
  })
  const dados = await resposta.json().catch(() => ({}))
  if (!resposta.ok) throw new Error(dados.erro || `HTTP ${resposta.status}`)
  return dados
}

const valorDe = (t) => (estado.edicoes[t.key] !== undefined ? estado.edicoes[t.key] : t.valor)

const conteudoSujo = () =>
  estado.rascunho !== null && JSON.stringify(estado.rascunho) !== JSON.stringify(estado.conteudo)

const sujo = () => (emTextos() ? Object.keys(estado.edicoes).length > 0 : conteudoSujo())

function situacao(texto, classe = '') {
  const el = $('#situacao')
  el.textContent = texto
  el.className = classe
}

// --- carregamento ---------------------------------------------------------

async function iniciar() {
  const { tenants, grupos } = await api('GET', '/api/tenants')
  estado.grupos = grupos

  const select = $('#tenant')
  select.innerHTML = tenants
    .map((t) => `<option value="${t.slug}">${escapar(t.nome)} — ${t.slug}</option>`)
    .join('')
  select.onchange = () => trocarTenant(select.value)

  try {
    const git = await api('GET', '/api/git/status')
    $('#branch').textContent = `branch ${git.branch}`
  } catch { /* sem git, o resto do estúdio funciona igual */ }

  if (tenants.length === 0) {
    $('#lista').innerHTML = '<p class="vazio">Nenhum restaurante em whatsapp/tenants/.</p>'
    return
  }
  await trocarTenant(tenants[0].slug)
}

async function trocarTenant(slug) {
  if (sujo() && !confirm('Você tem edições não salvas. Trocar de restaurante vai descartá-las.')) {
    $('#tenant').value = estado.slug
    return
  }
  estado.slug = slug
  estado.edicoes = {}
  estado.rascunho = null
  estado.focada = null

  const [textos, conteudo, uso] = await Promise.all([
    api('GET', `/api/textos/${slug}`),
    api('GET', `/api/conteudo/${slug}`),
    api('GET', `/api/conteudo/${slug}/uso`).catch(() => ({ areas: {}, semBanco: true })),
  ])

  estado.textos = textos.textos
  estado.conteudo = conteudo.conteudo
  estado.rascunho = clonar(conteudo.conteudo)
  estado.dias = conteudo.dias
  estado.uso = uso

  const avisos = [...textos.avisos, ...conteudo.avisos]
  situacao(avisos.length ? avisos.join(' · ') : '', avisos.length ? 'erro' : '')
  desenharModos()
  desenharAbas()
  desenhar()
}

function desenharModos() {
  $('#modos').innerHTML = MODOS.map(
    (modo) => `<button class="modo ${modo.id === estado.modo ? 'ativa' : ''}" data-modo="${modo.id}">${modo.nome}</button>`,
  ).join('')
  for (const botao of document.querySelectorAll('.modo')) {
    botao.onclick = () => {
      if (sujo() && !confirm('Você tem edições não salvas. Trocar de seção vai descartá-las.')) return
      estado.edicoes = {}
      estado.rascunho = clonar(estado.conteudo)
      estado.modo = botao.dataset.modo
      estado.focada = null
      $('#salvar').disabled = true
      $('#reverter').disabled = true
      desenharModos()
      desenharAbas()
      desenhar()
      if (!emTextos()) previsualizarConteudo()
    }
  }
  // A busca e as abas de grupo só fazem sentido no catálogo de textos.
  $('#busca').style.display = emTextos() ? '' : 'none'
  $('#abas').style.display = emTextos() ? '' : 'none'
}

// --- desenho --------------------------------------------------------------

function escapar(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
}

function desenharAbas() {
  $('#abas').innerHTML = Object.entries(estado.grupos)
    .map(([id, nome]) => {
      const total = estado.textos.filter((t) => t.grupo === id).length
      const custom = estado.textos.filter((t) => t.grupo === id && (t.customizado || estado.edicoes[t.key] !== undefined)).length
      const conta = custom ? `<span class="conta">${custom}/${total}</span>` : `<span class="conta">${total}</span>`
      return `<button class="aba ${id === estado.aba ? 'ativa' : ''}" data-grupo="${id}">${escapar(nome)}${conta}</button>`
    })
    .join('')
  for (const botao of document.querySelectorAll('.aba')) {
    botao.onclick = () => { estado.aba = botao.dataset.grupo; desenharAbas(); desenhar() }
  }
}

function visiveis() {
  const busca = estado.busca.toLowerCase()
  return estado.textos.filter((t) => {
    if (t.grupo !== estado.aba) return false
    if (!busca) return true
    return (t.rotulo + t.key + valorDe(t)).toLowerCase().includes(busca)
  })
}

function desenhar() {
  if (!emTextos()) return desenharConteudo()

  const lista = $('#lista')
  const itens = visiveis()

  const aviso =
    estado.aba === 'templates'
      ? `<div class="avisoTemplate">
           <strong>Editar aqui não muda o que a Meta envia.</strong>
           Estes são os templates aprovados no WhatsApp Manager. O texto novo só passa a valer
           depois de você editar e reenviar o template para aprovação lá — este catálogo é a
           referência do que está cadastrado, e serve para gerar o corpo que você cola no Manager.
         </div>`
      : ''

  if (itens.length === 0) {
    lista.innerHTML = aviso + '<p class="vazio">Nenhum texto com esse termo.</p>'
    return
  }

  lista.innerHTML = aviso + itens.map(cartao).join('')

  for (const campo of lista.querySelectorAll('[data-key]')) {
    const key = campo.dataset.key
    campo.oninput = () => aoEditar(key, campo)
    campo.onfocus = () => { estado.focada = key; marcarFoco(); previsualizar(key) }
  }
  for (const chip of lista.querySelectorAll('.var')) {
    chip.onclick = () => inserirVariavel(chip.dataset.alvo, chip.dataset.nome)
  }
  for (const botao of lista.querySelectorAll('[data-reset]')) {
    botao.onclick = () => voltarAoPadrao(botao.dataset.reset)
  }
  marcarFoco()
}

function cartao(t) {
  const valor = valorDe(t)
  const mudou = estado.edicoes[t.key] !== undefined
  const custom = valor !== t.padrao
  const excedeu = t.limite && valor.length > t.limite

  const campo = t.multilinha
    ? `<textarea data-key="${t.key}" rows="${Math.min(10, valor.split('\n').length + 1)}">${escapar(valor)}</textarea>`
    : `<input class="campo" data-key="${t.key}" value="${escapar(valor)}" />`

  const chips = t.variaveis
    .map((v) => `<button class="var" data-alvo="${t.key}" data-nome="${v}">{${v}}</button>`)
    .join('')

  const contador = t.limite
    ? `<span class="contador ${excedeu ? 'estourou' : ''}">${valor.length}/${t.limite}${excedeu ? ' — a Meta vai cortar' : ''}</span>`
    : `<span class="contador">${valor.length}</span>`

  return `
    <div class="cartao ${estado.focada === t.key ? 'editando' : ''}" id="cartao-${cssId(t.key)}">
      <div class="linha1">
        <div style="flex:1">
          <h3>${escapar(t.rotulo)}</h3>
          <div class="chave">${t.key}</div>
        </div>
        ${mudou ? '<span class="selo">editado</span>' : custom ? '<span class="selo">customizado</span>' : ''}
      </div>
      ${t.ajuda ? `<p class="ajuda">${escapar(t.ajuda)}</p>` : ''}
      ${campo}
      <div class="rodapeCartao">
        ${chips}
        ${custom ? `<button class="link" data-reset="${t.key}">voltar ao padrão</button>` : ''}
        ${contador}
      </div>
    </div>`
}

const cssId = (key) => key.replace(/\./g, '-')

function marcarFoco() {
  for (const cartao of document.querySelectorAll('.cartao')) cartao.classList.remove('editando')
  if (estado.focada) document.getElementById(`cartao-${cssId(estado.focada)}`)?.classList.add('editando')
}

// --- edição ---------------------------------------------------------------

function aoEditar(key, campo) {
  const texto = estado.textos.find((t) => t.key === key)
  if (campo.value === texto.valor) delete estado.edicoes[key]
  else estado.edicoes[key] = campo.value

  atualizarRodape(key, campo.value, texto)
  $('#salvar').disabled = !sujo()
  $('#reverter').disabled = !sujo()
  situacao('')
  desenharAbas()
  agendarPreview(key)
}

/** Atualiza contador e selo sem redesenhar — redesenhar tiraria o cursor do campo. */
function atualizarRodape(key, valor, texto) {
  const cartao = document.getElementById(`cartao-${cssId(key)}`)
  if (!cartao) return
  const contador = cartao.querySelector('.contador')
  if (texto.limite) {
    const excedeu = valor.length > texto.limite
    contador.className = `contador ${excedeu ? 'estourou' : ''}`
    contador.textContent = `${valor.length}/${texto.limite}${excedeu ? ' — a Meta vai cortar' : ''}`
  } else {
    contador.textContent = valor.length
  }
  const selo = cartao.querySelector('.selo')
  const mudou = estado.edicoes[key] !== undefined
  if (mudou && !selo) cartao.querySelector('.linha1').insertAdjacentHTML('beforeend', '<span class="selo">editado</span>')
  else if (selo) selo.textContent = mudou ? 'editado' : 'customizado'
}

function inserirVariavel(key, nome) {
  const campo = document.querySelector(`[data-key="${key}"]`)
  if (!campo) return
  const inicio = campo.selectionStart ?? campo.value.length
  const fim = campo.selectionEnd ?? inicio
  campo.value = `${campo.value.slice(0, inicio)}{${nome}}${campo.value.slice(fim)}`
  campo.focus()
  campo.setSelectionRange(inicio + nome.length + 2, inicio + nome.length + 2)
  aoEditar(key, campo)
}

function voltarAoPadrao(key) {
  const texto = estado.textos.find((t) => t.key === key)
  estado.edicoes[key] = texto.padrao
  if (texto.padrao === texto.valor) delete estado.edicoes[key]
  $('#salvar').disabled = !sujo()
  $('#reverter').disabled = !sujo()
  desenharAbas()
  desenhar()
  previsualizar(key)
}

// --- preview --------------------------------------------------------------

let timerPreview = null
function agendarPreview(key) {
  clearTimeout(timerPreview)
  timerPreview = setTimeout(() => previsualizar(key), 300)
}

async function previsualizar(key) {
  try {
    const preview = await api('POST', `/api/preview/${estado.slug}`, { key, textos: estado.edicoes })
    $('#zap').innerHTML = preview.tipo === 'payload' ? desenharPayload(preview.payload) : `<div class="bolha">${escapar(preview.texto)}</div>`
  } catch (erro) {
    $('#zap').innerHTML = `<p style="color:var(--err);margin:0">${escapar(erro.message)}</p>`
  }
}

/** Desenha o payload da Cloud API como o WhatsApp desenharia. */
function desenharPayload(payload) {
  if (payload.type === 'text') return `<div class="bolha">${escapar(payload.text.body)}</div>`

  const interativo = payload.interactive || {}
  const corpo = interativo.body?.text ?? ''
  let html = `<div class="bolha">${escapar(corpo)}</div>`

  if (interativo.type === 'button') {
    for (const botao of interativo.action?.buttons ?? []) {
      html += `<div class="btnZap">${escapar(botao.reply.title)}</div>`
    }
  } else if (interativo.type === 'list') {
    html += `<div class="btnZap">☰ ${escapar(interativo.action?.button ?? '')}</div>`
    for (const secao of interativo.action?.sections ?? []) {
      if (secao.title) html += `<div class="secaoZap">${escapar(secao.title)}</div>`
      for (const linha of secao.rows ?? []) {
        html += `<div class="rowZap">${escapar(linha.title)}${linha.description ? `<small>${escapar(linha.description)}</small>` : ''}</div>`
      }
    }
  } else if (interativo.type === 'cta_url') {
    html += `<div class="btnZap">🔗 ${escapar(interativo.action?.parameters?.display_text ?? '')}</div>`
  }

  if (JSON.stringify(payload).includes('…')) {
    html += '<p class="cortado" style="font-size:12px;margin:10px 0 0">⚠️ Algum texto foi cortado pela Meta (o “…”).</p>'
  }
  return html
}

/**
 * Um campo ligado a um caminho do rascunho, ex.: `areas.0.name`.
 * Toda edição escreve no rascunho e redesenha a prévia — não a lista, para o
 * cursor não pular do lugar enquanto se digita.
 */
function campo(caminho, valor, opcoes = {}) {
  const { tipo = 'text', rotulo = '', dica = '', largura = '' } = opcoes
  const attrs = tipo === 'number' ? 'type="number"' : 'type="text"'
  return `
    <label style="${largura}">
      ${rotulo ? `<span class="campoRot">${escapar(rotulo)}${dica ? ` <small>${escapar(dica)}</small>` : ''}</span>` : ''}
      <input class="campo" ${attrs} data-caminho="${caminho}" value="${escapar(valor ?? '')}" />
    </label>`
}

/**
 * O identificador do item, do jeito que ele é hoje.
 *
 * Item que acabou de ser adicionado na tela ainda não tem slug — ele é
 * carimbado no salvamento, pelo servidor. Quem já existe e está sem slug é um
 * config antigo, que ganha o dele no próximo salvamento sem mudar de linha no
 * banco (o slug derivado do nome é exatamente o que o sync já usava).
 */
function identidade(item) {
  if (item.slug) return `<span class="slugTag">${escapar(item.slug)}</span>`
  if (item._novo) return '<span class="selo">novo</span>'
  return '<span class="slugTag" title="Recebe o identificador no próximo salvamento">sem identificador</span>'
}

function interruptor(caminho, valor, rotulo) {
  return `
    <label class="switch">
      <input type="checkbox" data-caminho="${caminho}" ${valor ? 'checked' : ''} />
      ${escapar(rotulo)}
    </label>`
}

function escreverNoRascunho(caminho, valor) {
  const partes = caminho.split('.')
  let alvo = estado.rascunho
  for (const parte of partes.slice(0, -1)) alvo = alvo[parte]
  alvo[partes.at(-1)] = valor
}

function ligarCampos() {
  for (const campo of document.querySelectorAll('[data-caminho]')) {
    const caminho = campo.dataset.caminho
    const evento = campo.type === 'checkbox' ? 'onchange' : 'oninput'
    campo[evento] = () => {
      const valor =
        campo.type === 'checkbox' ? campo.checked
        : campo.type === 'number' ? Number(campo.value)
        : campo.value
      escreverNoRascunho(caminho, valor)
      marcarSujo()
      agendarPreviewConteudo()
    }
  }
  for (const botao of document.querySelectorAll('[data-acao]')) {
    botao.onclick = () => acoesConteudo[botao.dataset.acao](botao.dataset)
  }
}

function marcarSujo() {
  $('#salvar').disabled = !sujo()
  $('#reverter').disabled = !sujo()

}

async function previsualizarConteudo() {
  const secao = estado.modo === 'contact' ? 'contact' : estado.modo
  try {
    const preview = await api('POST', `/api/preview-conteudo/${estado.slug}`, {
      secao,
      conteudo: estado.rascunho,
    })
    $('#zap').innerHTML = desenharPayload(preview.payload)
  } catch (erro) {
    $('#zap').innerHTML = `<p style="color:var(--muted);margin:0">${escapar(erro.message)}</p>`
  }
}

// --- salvar e publicar ----------------------------------------------------

async function salvar() {
  if (!emTextos()) return salvarConteudo()

  const textos = {}
  for (const t of estado.textos) textos[t.key] = valorDe(t)

  situacao('Salvando…')
  try {
    const r = await api('PUT', `/api/textos/${estado.slug}`, { textos })
    estado.edicoes = {}
    const dados = await api('GET', `/api/textos/${estado.slug}`)
    estado.textos = dados.textos
    $('#salvar').disabled = true
    $('#reverter').disabled = true
    desenharAbas()
    desenhar()
    const avisos = r.avisos?.length ? ` · ${r.avisos.join(' · ')}` : ''
    situacao(`${r.detalhe}${avisos}`, r.aplicado ? 'ok' : 'erro')
  } catch (erro) {
    situacao(erro.message, 'erro')
  }
}

async function salvarConteudo() {
  situacao('Salvando…')
  try {
    const r = await api('PUT', `/api/conteudo/${estado.slug}`, estado.rascunho)

    // Relê do disco: o servidor carimba o slug dos itens novos, e a tela
    // precisa passar a conhecê-lo — é ele que amarra o item às reservas.
    const dados = await api('GET', `/api/conteudo/${estado.slug}`)
    estado.conteudo = dados.conteudo
    estado.rascunho = clonar(dados.conteudo)
    estado.uso = await api('GET', `/api/conteudo/${estado.slug}/uso`).catch(() => estado.uso)

    $('#salvar').disabled = true
    $('#reverter').disabled = true
    desenharConteudo()
    previsualizarConteudo()

    const avisos = r.avisos?.length ? ` · ${r.avisos.join(' · ')}` : ''
    situacao(`${r.detalhe}${avisos}`, r.aplicado ? 'ok' : 'erro')
  } catch (erro) {
    situacao(erro.message, 'erro')
  }
}

async function abrirPublicar() {
  try {
    const git = await api('GET', '/api/git/status')
    $('#modalBranch').textContent = git.branch
    $('#modalDiff').innerHTML = git.diff
      ? git.diff.split('\n').map((linha) => {
          const classe = linha.startsWith('+') ? 'mais' : linha.startsWith('-') ? 'menos' : linha.startsWith('@@') || linha.startsWith('diff') ? 'cab' : ''
          return `<span class="${classe}">${escapar(linha)}</span>`
        }).join('\n')
      : 'Nada alterado nos configs dos restaurantes.'
    $('#modalPublicar').showModal()
  } catch (erro) {
    situacao(erro.message, 'erro')
  }
}

async function publicar() {
  const mensagem = $('#modalMensagem').value.trim()
  if (!mensagem) return
  situacao('Publicando…')
  try {
    const r = await api('POST', '/api/git/publicar', { mensagem })
    $('#modalPublicar').close()
    $('#modalMensagem').value = ''
    situacao(`Publicado: ${r.commit} na branch ${r.branch}`, 'ok')
  } catch (erro) {
    situacao(erro.message, 'erro')
  }
}

$('#salvar').onclick = salvar
$('#publicar').onclick = abrirPublicar
$('#reverter').onclick = () => {
  estado.edicoes = {}
  estado.rascunho = clonar(estado.conteudo)
  $('#salvar').disabled = true
  $('#reverter').disabled = true
  desenharAbas()
  desenhar()
  // A prévia mostrava a edição que acabou de sumir.
  if (emTextos()) {
    if (estado.focada) previsualizar(estado.focada)
  } else {
    previsualizarConteudo()
  }
  situacao('Edições descartadas.')
}
$('#modalCancelar').onclick = () => $('#modalPublicar').close()
$('#modalConfirmar').onclick = publicar
$('#busca').oninput = (e) => { estado.busca = e.target.value; desenhar() }

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (sujo()) salvar() }
})
window.addEventListener('beforeunload', (e) => { if (sujo()) e.preventDefault() })

iniciar().catch((erro) => {
  $('#lista').innerHTML = `<p class="vazio" style="color:var(--err)">${escapar(erro.message)}</p>`
})
</script>
</body>
</html>
